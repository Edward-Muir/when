name: Publish Theme

# Writes the curated daily-theme calendar.
#
# The point of running this in CI rather than from a laptop or an agent session is twofold:
# the admin secret stays in GitHub Secrets and never reaches whoever is composing the theme,
# and because the repo is checked out here, the publish script can validate slugs and
# timeline spread against the REAL event catalogue before anything is stored. The API itself
# cannot do that — api/ is a separate tsconfig project and public/events/ is served
# statically rather than bundled into the function.
#
# Two ways in. `themes` + `start` schedules decks already committed to themes/bank.json, which
# is how a run of consecutive Sundays goes up: one dispatch, three short inputs, dates derived
# rather than pasted. `theme` takes a single deck inline, for one not in the bank yet. Set one
# or the other — the script refuses both, because a precedence rule is invisible to whoever
# is filling in this form.
#
# Dispatch defaults to `validate`, so a mis-click cannot write anything.

on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Bank ids to schedule (comma-separated) or "all". Dates come from start/every_days below.'
        type: string
        default: ''
      start:
        description: 'Date the first bank theme runs, YYYY-MM-DD. Required with themes.'
        type: string
        default: ''
      every_days:
        description: 'Days between bank themes. 7 = weekly.'
        type: string
        default: '7'
      theme:
        description: 'Ad-hoc theme JSON, for a deck not in the bank: {"id","name","eventNames":[...],"dates":[...]}'
        type: string
        default: ''
      mode:
        description: 'validate = report only; publish = validate then write'
        type: choice
        default: validate
        options:
          - validate
          - publish
      force:
        description: 'Publish a date that has already opened (splits the day for UTC+13/+14)'
        type: boolean
        default: false
      remove:
        description: 'Theme id to delete instead of adding. Leave blank to add or update.'
        type: string
        default: ''

# The calendar write is read-modify-write, so two runs must not interleave. The API also
# rejects a stale baseVersion; this just stops the race from happening in the first place.
concurrency: publish-theme

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: scripts/publish-theme.js is dependency-free so the job stays fast.
      - name: Validate and publish
        run: node scripts/publish-theme.js
        env:
          # Passed through the environment, never interpolated into the shell. `${{ }}` inside
          # a run: block splices attacker-controlled text straight into bash.
          THEME_IDS: ${{ inputs.themes }}
          THEME_START: ${{ inputs.start }}
          THEME_EVERY_DAYS: ${{ inputs.every_days }}
          THEME_JSON: ${{ inputs.theme }}
          THEME_MODE: ${{ inputs.mode }}
          THEME_FORCE: ${{ inputs.force }}
          THEME_REMOVE: ${{ inputs.remove }}
          THEMES_ADMIN_KEY: ${{ secrets.THEMES_ADMIN_KEY }}
          THEMES_API_URL: https://www.play-when.com
